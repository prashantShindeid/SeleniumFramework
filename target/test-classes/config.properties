# Which environment to point at
env=qa

# Base URL per environment \u2014 ConfigReader.getBaseUrl() resolves env + ".url"
qa.url=https://rahulshettyacademy.com/client/#/dashboard/dash
staging.url=https://staging.example.com
prod.url=https://www.example.com

# Which browser to launch
browser=chrome
headless=false

# How long to wait before timing out (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30

# How many times to retry a failed test
max.retry.count=2

# Where to save screenshots on failure
screenshot.path=test-output/screenshots/